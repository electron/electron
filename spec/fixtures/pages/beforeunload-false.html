<html>
<body>
<script type="text/javascript" charset="utf-8">
  window.onbeforeunload = function() {
    // Report synchronously. Without a user gesture Chromium skips the
    // confirmation and the navigation goes ahead, so a deferred message can
    // be dropped when this document unloads.
    var ipcRenderer = require('electron').ipcRenderer;
    ipcRenderer.sendToHost('onbeforeunload');
    return false;
  }
</script>
</body>
</html>
