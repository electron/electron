# Deterministic IPP Everywhere capabilities, including explicit defaults.
# -a supplies the complete attributes; do not combine it with legacy -f/-P.
ATTR mimeMediaType document-format-supported application/pdf
ATTR mimeMediaType document-format-default application/pdf
ATTR boolean color-supported true
ATTR integer copies-default 1
ATTR rangeOfInteger copies-supported 1-99
ATTR keyword media-default na_letter_8.5x11in
ATTR keyword media-supported iso_a4_210x297mm,na_letter_8.5x11in
# Windows' IPP Class Driver can round dimensions down by 0.01 mm. Accept that
# conversion while keeping the canonical paper sizes in media-col-database.
ATTR collection media-size-supported {
  MEMBER rangeOfInteger x-dimension 20999-21000
  MEMBER rangeOfInteger y-dimension 29699-29700
}, {
  MEMBER rangeOfInteger x-dimension 21589-21590
  MEMBER rangeOfInteger y-dimension 27939-27940
}
ATTR keyword media-source-supported main,manual,by-pass-tray
ATTR keyword media-type-supported stationery,labels,cardstock
ATTR keyword media-col-supported media-size,media-source,media-type,media-top-margin,media-bottom-margin,media-left-margin,media-right-margin
ATTR collection media-col-default {
  MEMBER collection media-size {
    MEMBER integer x-dimension 21590
    MEMBER integer y-dimension 27940
  }
  MEMBER keyword media-source main
  MEMBER keyword media-type stationery
  MEMBER integer media-bottom-margin 635
  MEMBER integer media-left-margin 635
  MEMBER integer media-right-margin 635
  MEMBER integer media-top-margin 635
}
ATTR collection media-col-database {
  MEMBER collection media-size {
    MEMBER integer x-dimension 21000
    MEMBER integer y-dimension 29700
  }
  MEMBER integer media-bottom-margin 635
  MEMBER integer media-left-margin 635
  MEMBER integer media-right-margin 635
  MEMBER integer media-top-margin 635
}, {
  MEMBER collection media-size {
    MEMBER integer x-dimension 21590
    MEMBER integer y-dimension 27940
  }
  MEMBER integer media-bottom-margin 635
  MEMBER integer media-left-margin 635
  MEMBER integer media-right-margin 635
  MEMBER integer media-top-margin 635
}
ATTR integer media-bottom-margin-supported 635
ATTR integer media-left-margin-supported 635
ATTR integer media-right-margin-supported 635
ATTR integer media-top-margin-supported 635
ATTR keyword print-color-mode-default color
ATTR keyword print-color-mode-supported color,monochrome
ATTR enum print-quality-default 4
ATTR enum print-quality-supported 3,4,5
ATTR resolution printer-resolution-default 600dpi
ATTR resolution printer-resolution-supported 300dpi,600dpi
ATTR keyword sides-default one-sided
ATTR keyword sides-supported one-sided,two-sided-long-edge,two-sided-short-edge
ATTR keyword multiple-document-handling-default separate-documents-collated-copies
ATTR keyword multiple-document-handling-supported separate-documents-collated-copies,separate-documents-uncollated-copies
