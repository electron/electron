<!doctype html>
<html>
  <body>
    <div id="update"></div>
    <script>
      var hasAttributionPromise = new Promise((resolve) => {
        let busyLoopStart;
        // A slow host can report other long frames too, such as a first paint
        // with no script in it, or one that also ran a short executeJavaScript()
        // call that has no URL. Only check the frame that ran the busy loop.
        new PerformanceObserver((list) => {
          for (const { startTime, duration, scripts } of list.getEntries()) {
            if (busyLoopStart === undefined || startTime > busyLoopStart || startTime + duration < busyLoopStart) {
              continue;
            }
            resolve(
              scripts.some(
                ({ invoker, sourceURL }) => invoker === 'FrameRequestCallback' && sourceURL === location.href
              )
            );
            return;
          }
        }).observe({ type: 'long-animation-frame', buffered: true });

        // Produce a long animation frame
        requestAnimationFrame(() => {
          busyLoopStart = performance.now();
          document.querySelector('#update').innerHTML = 'Update';
          while (performance.now() < busyLoopStart + 60) {}
          requestAnimationFrame(() => {});
        });
      });
    </script>
  </body>
</html>
