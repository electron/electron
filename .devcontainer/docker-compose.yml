version: '3'

services:
  buildtools:
    image: ghcr.io/electron/devcontainer:94c34134b34b1993cac0c179b4a26e8277d576e5

    volumes:
      - ..:/workspaces/gclient/src/electron:cached

      - /var/run/docker.sock:/var/run/docker.sock

    command: /bin/sh -c "while sleep 1000; do :; done"

    user: builduser

    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
