version: '3'

services:
  buildtools:
    image: ghcr.io/electron/devcontainer:f8e0a27f678c0764b418dcd351bd1b0ccc1d1fa4

    volumes:
      - ..:/workspaces/gclient/src/electron:cached

      - /var/run/docker.sock:/var/run/docker.sock

    command: /bin/sh -c "while sleep 1000; do :; done"

    user: builduser

    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
