version: '3'

services:
  buildtools:
    image: ghcr.io/electron/devcontainer:73d09a918de785619880e7f483a187bbc2aac832

    volumes:
      - ..:/workspaces/gclient/src/electron:cached

      - /var/run/docker.sock:/var/run/docker.sock

    command: /bin/sh -c "while sleep 1000; do :; done"

    user: builduser

    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
