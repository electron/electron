version: '3'

services:
  buildtools:
    image: ghcr.io/electron/devcontainer:a64d60a8f35fe163b567b4968699b866646085f9

    volumes:
      - ..:/workspaces/gclient/src/electron:cached

      - /var/run/docker.sock:/var/run/docker.sock

    command: /bin/sh -c "while sleep 1000; do :; done"

    user: builduser

    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
