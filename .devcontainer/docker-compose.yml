version: '3'

services:
  buildtools:
    image: ghcr.io/electron/devcontainer:48409d6a437ba91fef2c5c1dd81e979c15b2f6cd

    volumes:
      - ..:/workspaces/gclient/src/electron:cached

      - /var/run/docker.sock:/var/run/docker.sock

    command: /bin/sh -c "while sleep 1000; do :; done"

    user: builduser

    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
