version: '3'

services:
  buildtools:
    image: ghcr.io/electron/devcontainer:9ec8ab8e8837540175140c558e34ab057b1426fc

    volumes:
      - ..:/workspaces/gclient/src/electron:cached

      - /var/run/docker.sock:/var/run/docker.sock

    command: /bin/sh -c "while sleep 1000; do :; done"

    user: builduser

    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
