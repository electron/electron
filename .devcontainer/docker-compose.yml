version: '3'

services:
  buildtools:
    image: ghcr.io/electron/devcontainer:4db2fbc7034dce0bcea238a280794a9225b93bf1

    volumes:
      - ..:/workspaces/gclient/src/electron:cached

      - /var/run/docker.sock:/var/run/docker.sock

    command: /bin/sh -c "while sleep 1000; do :; done"

    user: builduser

    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
