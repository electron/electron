name: Pipeline Segment - Electron Clang-Tidy

on:
  workflow_call:
    inputs:
      target-platform:
        type: string
        description: 'Platform to run on, can be macos, win or linux'
        required: true
      target-arch:
        type: string
        description: 'Arch to build for, can be x64 or arm64'
        required: true
      clang-tidy-runs-on:
        type: string
        description: 'What host to run clang-tidy on'
        required: true
      clang-tidy-container:
        type: string
        description: 'JSON container information for aks runs-on'
        required: false
        default: '{"image":null}'

permissions: {}

concurrency:
  group: electron-clang-tidy-${{ inputs.target-platform }}-${{ inputs.target-arch }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GCLIENT_EXTRA_ARGS: ${{ inputs.target-platform == 'macos' && '--custom-var=checkout_mac=True --custom-var=host_os=mac' || (inputs.target-platform == 'linux' && '--custom-var=checkout_arm64=True' || '--custom-var=checkout_win=True') }}
  ELECTRON_OUT_DIR: Default

jobs:
  # Pull requests only check the translation units they touch (plus any that
  # include a header they touch). Pushes, and PRs that change clang-tidy's own
  # inputs, check the whole tree.
  files:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    outputs:
      scope: ${{ steps.select.outputs.scope }}
      files: ${{ steps.select.outputs.files }}
    steps:
    - name: Checkout Electron
      if: ${{ github.event_name == 'pull_request' }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        persist-credentials: false
    - name: Select files
      id: select
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT_NAME: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -eo pipefail
        if [ "$EVENT_NAME" != "pull_request" ]; then
          echo "Not a pull request; checking the whole tree"
          echo "scope=all" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        changed=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq '.[] | select(.status != "removed") | .filename')
        # Config, driver, this workflow, or DEPS (which carries Chromium's
        # clang/clang-tidy roll): re-check everything.
        if grep -qE '(^|/)\.clang-tidy$|^DEPS$|^script/run-clang-tidy\.ts$|^\.github/workflows/pipeline-segment-electron-clang-tidy\.yml$' <<< "$changed"; then
          echo "clang-tidy inputs changed; checking the whole tree"
          echo "scope=all" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        tus=$(grep -E '^shell/.+\.(cc|mm)$' <<< "$changed" || true)
        while IFS= read -r header; do
          [ -n "$header" ] || continue
          tus+=$'\n'$(git grep -lF -e "#include \"${header}\"" -e "#import \"${header}\"" -- 'shell/*.cc' 'shell/*.mm' || true)
        done <<< "$(grep -E '^shell/.+\.h$' <<< "$changed" || true)"
        files=$(sed '/^$/d' <<< "$tus" | sort -u | tr '\n' ' ')
        if [ -z "$files" ]; then
          echo "No translation units under shell/ affected; skipping clang-tidy"
          echo "scope=none" >> "$GITHUB_OUTPUT"
        else
          echo "Checking: $files"
          echo "scope=changed" >> "$GITHUB_OUTPUT"
          echo "files=$files" >> "$GITHUB_OUTPUT"
        fi
  clang-tidy:
    needs: files
    if: ${{ needs.files.outputs.scope != 'none' }}
    defaults:
      run:
        shell: bash
    runs-on: ${{ inputs.clang-tidy-runs-on }}
    permissions:
      contents: read
    container: ${{ fromJSON(inputs.clang-tidy-container) }} # zizmor: ignore[unpinned-images] the caller passes ghcr.io/electron/build tagged by the content hash computed in build.yml; there is no static digest to pin
    env:
      BUILD_TYPE: ${{ inputs.target-platform == 'macos' && 'darwin' || inputs.target-platform }}
      TARGET_ARCH: ${{ inputs.target-arch }}
      TARGET_PLATFORM: ${{ inputs.target-platform }}
      ARTIFACT_KEY: ${{ inputs.target-platform == 'macos' && 'darwin' || inputs.target-platform }}_${{ inputs.target-arch }}
    steps:
    - name: Checkout Electron
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: src/electron
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha }}
        persist-credentials: false
    - name: Cleanup disk space on macOS
      if: ${{ inputs.target-platform == 'macos' }}
      shell: bash
      run: |   
        sudo mkdir -p $TMPDIR/del-target

        tmpify() {
          if [ -d "$1" ]; then
            sudo mv "$1" $TMPDIR/del-target/$(echo $1|shasum -a 256|head -n1|cut -d " " -f1)
          fi
        }   
        tmpify /Library/Developer/CoreSimulator
        tmpify ~/Library/Developer/CoreSimulator
        sudo rm -rf $TMPDIR/del-target
    - name: Check disk space after freeing up space
      if: ${{ inputs.target-platform == 'macos' }}
      run: df -h
    - name: Set Chromium Git Cookie
      uses: ./src/electron/.github/actions/set-chromium-cookie
    - name: Install Build Tools
      uses: ./src/electron/.github/actions/install-build-tools
    - name: Enable windows toolchain
      if: ${{ inputs.target-platform == 'win' }}
      run: |
        echo "ELECTRON_DEPOT_TOOLS_WIN_TOOLCHAIN=1" >> $GITHUB_ENV
    - name: Generate DEPS Hash
      run: |
        node src/electron/script/generate-deps-hash.js
        DEPSHASH=v2-src-cache-$(cat src/electron/.depshash)
        echo "DEPSHASH=$DEPSHASH" >> $GITHUB_ENV
        echo "CACHE_PATH=$DEPSHASH.tar" >> $GITHUB_ENV
    - name: Restore src cache via AZCopy
      if: ${{ inputs.target-platform == 'macos' }}
      uses: ./src/electron/.github/actions/restore-cache-azcopy
      with:
        target-platform: ${{ inputs.target-platform }}      
    - name: Restore src cache via AKS
      if: ${{ inputs.target-platform == 'linux' || inputs.target-platform == 'win' }}
      uses: ./src/electron/.github/actions/restore-cache-aks
      with:
        target-platform: ${{ inputs.target-platform }}
    - name: Checkout Electron
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: src/electron
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha }}
        persist-credentials: false
    - name: Fix hermetic Python (macOS)
      if: ${{ inputs.target-platform == 'macos' }}
      uses: ./src/electron/.github/actions/cipd-install
      with:
        dependency: cpython3-host
        deps-file: src/DEPS
        installation-dir: src/third_party/cpython3/host
        target-platform: ${{ inputs.target-platform }}
        package: infra/3pp/tools/cpython3/${platform}
    - name: Run Electron Only Hooks
      run: |
        echo "solutions=[{'name':'src/electron','url':None,'deps_file':'DEPS','custom_vars':{'process_deps':False},'managed':False}]" > tmpgclient
        if [ "$TARGET_PLATFORM" = "win" ]; then
          echo "solutions=[{'name':'src/electron','url':None,'deps_file':'DEPS','custom_vars':{'process_deps':False,'install_sysroot':False,'checkout_win':True},'managed':False}]" > tmpgclient
          echo "target_os=['win']" >> tmpgclient
        fi
        e d gclient runhooks --gclientfile=tmpgclient

        # Fix VS Toolchain
        if [ "$TARGET_PLATFORM" = "win" ]; then
          rm -rf src/third_party/depot_tools/win_toolchain/vs_files
          e d python3 src/build/vs_toolchain.py update --force
        fi
    - name: Regenerate DEPS Hash
      run: |
        (cd src/electron && git checkout .) && node src/electron/script/generate-deps-hash.js
        echo "DEPSHASH=$(cat src/electron/.depshash)" >> $GITHUB_ENV
    - name: Install Dependencies
      uses: ./src/electron/.github/actions/install-dependencies
    - name: Default GN gen
      run: |
        cd src/electron
        git pack-refs
    - name: Download Out Gen Artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: out_gen_artifacts_${{ env.ARTIFACT_KEY }}
        path: ./src/out/${{ env.ELECTRON_OUT_DIR }}/gen
    - name: Add Clang problem matcher
      shell: bash
      run: echo "::add-matcher::src/electron/.github/problem-matchers/clang.json"
    - name: Run Clang-Tidy
      env:
        # macOS runners have fewer CPU cores, so use fewer jobs for better results
        CLANG_TIDY_JOBS: ${{ case(inputs.target-platform == 'macos', 5, 8) }}
        # Empty when checking the whole tree.
        CLANG_TIDY_FILES: ${{ needs.files.outputs.files }}
      run: |
        e init -f --root=$(pwd) --out=${ELECTRON_OUT_DIR} testing --target-cpu ${TARGET_ARCH} --remote-build none

        # For macOS use_remoteexec=false will cause GN errors, so even though we're doing no remote build, set it
        export GN_EXTRA_ARGS="use_remoteexec=true target_cpu=\"${TARGET_ARCH}\""
        if [ "$TARGET_PLATFORM" = "win" ]; then
          export GN_EXTRA_ARGS="$GN_EXTRA_ARGS use_v8_context_snapshot=true target_os=\"win\""
        fi

        e build --gen=only

        # Copy macOS framework headers so clang-tidy can find them via -F.
        # This must happen after e build since e init -f may
        # recreate the output directory.
        if [ "$TARGET_PLATFORM" = "macos" ]; then
          OUT=src/out/${ELECTRON_OUT_DIR}
          SQRL=src/third_party/squirrel.mac

          mkdir -p ${OUT}/{ReactiveObjC,Squirrel,Mantle}.framework/Headers

          cp ${SQRL}/vendor/ReactiveObjC/ReactiveObjC/*.h ${OUT}/ReactiveObjC.framework/Headers/
          cp ${SQRL}/vendor/ReactiveObjC/ReactiveObjC/extobjc/*.h ${OUT}/ReactiveObjC.framework/Headers/

          cp ${SQRL}/Squirrel/*.h ${OUT}/Squirrel.framework/Headers/

          cp ${SQRL}/vendor/Mantle/Mantle/include/*.h ${OUT}/Mantle.framework/Headers/
          cp ${SQRL}/vendor/Mantle/Mantle/extobjc/include/*.h ${OUT}/Mantle.framework/Headers/
        fi

        cd src/electron
        node script/yarn.js lint:clang-tidy --jobs ${CLANG_TIDY_JOBS} --out-dir ../out/${ELECTRON_OUT_DIR} ${CLANG_TIDY_FILES}
    - name: Remove Clang problem matcher
      shell: bash
      run: echo "::remove-matcher owner=clang::"
    - name: Wait for active SSH sessions
      if: always() && !cancelled()
      shell: bash
      run: |
        while [ -f /var/.ssh-lock ]
        do
          sleep 60
        done
