# TEMPORARY, not meant to merge: runs the Windows setIgnoreMouseEvents
# forwarding cases from spec/api-browser-window-ignore-mouse-events.spec.ts
# against the latest main build, to show which of them fail without
# https://github.com/electron/electron/pull/52633.
name: Spike - forwarding cases on main

on:
  push:
    branches:
      - spike/forwarding-cases-on-main

permissions:
  contents: read
  actions: read

env:
  SENTRYCLI_SKIP_DOWNLOAD: 1

jobs:
  test:
    name: test (${{ matrix.runner }})
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      BUILD_TYPE: win
      TARGET_ARCH: ${{ matrix.arch }}
      ARTIFACT_KEY: win_${{ matrix.arch }}
    steps:
    - name: Setup Node.js/npm
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 22.21.x
    - name: Checkout Electron
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: src/electron
        persist-credentials: false
    # The newest completed main build.yml run that still has this arch's
    # Windows build and src artifacts.
    - name: Find the latest main build
      id: main-run
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        for id in $(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs?branch=main&event=push&status=completed&per_page=20" --jq '.workflow_runs[].id'); do
          names=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/$id/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | .name' || true)
          if grep -qx "generated_artifacts_${ARTIFACT_KEY}" <<<"$names" && grep -qx "src_artifacts_${ARTIFACT_KEY}" <<<"$names"; then
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$id" --jq '.head_sha')
            echo "Using main build.yml run $id (https://github.com/${GITHUB_REPOSITORY}/actions/runs/$id) at $sha"
            echo "run-id=$id" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        done
        echo "::error::No recent main build.yml run has generated_artifacts_${ARTIFACT_KEY} and src_artifacts_${ARTIFACT_KEY}"
        exit 1
    - name: Download Generated Artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: generated_artifacts_${{ env.ARTIFACT_KEY }}
        path: ./generated_artifacts_${{ env.ARTIFACT_KEY }}
        run-id: ${{ steps.main-run.outputs.run-id }}
        github-token: ${{ github.token }}
        repository: ${{ github.repository }}
    - name: Download Src Artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: src_artifacts_${{ env.ARTIFACT_KEY }}
        path: ./src_artifacts_${{ env.ARTIFACT_KEY }}
        run-id: ${{ steps.main-run.outputs.run-id }}
        github-token: ${{ github.token }}
        repository: ${{ github.repository }}
    - name: Install Dependencies
      uses: ./src/electron/.github/actions/install-dependencies
    - name: Restore Generated Artifacts
      run: ./src/electron/script/actions/restore-artifacts.sh
    - name: Unzip Dist (win)
      shell: powershell
      run: |
        Set-ExecutionPolicy Bypass -Scope Process -Force
        cd src/out/Default
        Expand-Archive -Force dist.zip -DestinationPath ./
        if (Test-Path xcache.zip) { Expand-Archive -Force xcache.zip -DestinationPath ./ }
        .\electron.exe --version

    # On GitHub-hosted Windows runners the agent's terminal window sits in the
    # foreground and covers most of the desktop. Windows' native occlusion
    # tracking then marks test windows beneath it as hidden, so they stop
    # producing frames. Minimize it before the specs run.
    - name: Minimize Runner Terminal Window (Windows)
      shell: pwsh
      run: |
        Add-Type -Namespace ElectronCI -Name User32 -MemberDefinition @'
        [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr hWnd, int nCmdShow);
        [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr hWnd);
        [DllImport("user32.dll")] public static extern bool IsIconic(IntPtr hWnd);
        [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern IntPtr FindWindowEx(IntPtr parent, IntPtr after, string cls, string title);
        '@
        foreach ($cls in 'ConsoleWindowClass', 'CASCADIA_HOSTING_WINDOW_CLASS') {
          $h = [IntPtr]::Zero
          while (($h = [ElectronCI.User32]::FindWindowEx([IntPtr]::Zero, $h, $cls, [NullString]::Value)) -ne [IntPtr]::Zero) {
            if ([ElectronCI.User32]::IsWindowVisible($h) -and -not [ElectronCI.User32]::IsIconic($h)) {
              # 6 = SW_MINIMIZE
              [void][ElectronCI.User32]::ShowWindow($h, 6)
              Write-Host ("Minimized {0} window 0x{1:X}" -f $cls, $h.ToInt64())
            }
          }
        }

    # The windows-11-arm image has not finished its first sign-in and leaves
    # windows over the test area: real mouse input
    # (spec/fixtures/native-addon/mouse-input) clicks them instead of the
    # windows under test, and Chromium's native occlusion tracking reports
    # test windows beneath them as hidden. Close the privacy settings window
    # (WWAHost.exe, started by UserOOBEBroker.exe) and keep it from coming
    # back, close the Start menu with Escape (stopping its host made the
    # occlusion tracking misreport), close or minimize the other windows left
    # open, and log what the OS hit tests on screen. The image also keeps
    # relaunching `wsl.exe --update` in a new terminal window that takes the
    # foreground about every 90 seconds: stop the running one and keep
    # minimizing any that follow while the specs run.
    - name: Dismiss first sign-in windows (Windows)
      timeout-minutes: 5
      # Best effort: if the window stays up, the specs report what covers
      # them (describeWindowAtPoint) rather than failing here.
      continue-on-error: true
      shell: pwsh
      run: |
        $policy = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\OOBE'
        New-Item -Path $policy -Force | Out-Null
        Set-ItemProperty -Path $policy -Name DisablePrivacyExperience -Type DWord -Value 1
        $engagement = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\UserProfileEngagement'
        New-Item -Path $engagement -Force | Out-Null
        Set-ItemProperty -Path $engagement -Name ScoobeSystemSettingEnabled -Type DWord -Value 0
        $windows = { Get-Process | Where-Object { $_.MainWindowHandle -ne 0 } | Format-Table -AutoSize Id, ProcessName, MainWindowTitle | Out-String }
        Write-Host "Processes with windows before:`n$(& $windows)"
        foreach ($name in 'UserOOBEBroker', 'WWAHost') {
          Get-Process -Name $name -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host ("Stopping {0} ({1}): '{2}'" -f $_.ProcessName, $_.Id, $_.MainWindowTitle)
            Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue
          }
        }
        Start-Sleep -Seconds 2
        Write-Host "Processes with windows after:`n$(& $windows)"
        Add-Type -Namespace ElectronCI -Name HitTest -MemberDefinition @'
        [StructLayout(LayoutKind.Sequential)] public struct POINT { public int X; public int Y; }
        [DllImport("user32.dll")] public static extern IntPtr WindowFromPoint(POINT p);
        [DllImport("user32.dll")] public static extern IntPtr GetAncestor(IntPtr hWnd, uint flags);
        [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr hWnd, out uint pid);
        [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetClassName(IntPtr hWnd, System.Text.StringBuilder s, int n);
        [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetWindowText(IntPtr hWnd, System.Text.StringBuilder s, int n);
        public delegate bool EnumProc(IntPtr hWnd, IntPtr lParam);
        [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc cb, IntPtr lParam);
        [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr hWnd);
        [DllImport("user32.dll")] public static extern bool IsIconic(IntPtr hWnd);
        [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr hWnd, int cmd);
        [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr hWnd, uint msg, IntPtr w, IntPtr l);
        [DllImport("dwmapi.dll")] public static extern int DwmGetWindowAttribute(IntPtr hWnd, int attr, out int value, int size);
        [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern IntPtr FindWindow(string cls, string title);
        [DllImport("user32.dll")] public static extern void keybd_event(byte vk, byte scan, uint flags, UIntPtr extra);
        // Whether the Start menu is showing: its CoreWindow always exists but
        // is cloaked while the menu is closed.
        public static string StartMenuState() {
          IntPtr h = FindWindow("Windows.UI.Core.CoreWindow", "Start");
          if (h == IntPtr.Zero) return "absent";
          int cloaked = 0;
          DwmGetWindowAttribute(h, 14, out cloaked, 4);
          return (IsWindowVisible(h) && cloaked == 0) ? "open" : "closed";
        }
        public static void PressEscape() {
          keybd_event(0x1B, 0, 0, UIntPtr.Zero);
          keybd_event(0x1B, 0, 2, UIntPtr.Zero);  // KEYEVENTF_KEYUP
        }
        // Minimizes (dialogs: closes) visible, uncloaked top level windows
        // other than the shell's desktop and taskbar. Returns what it did.
        public static System.Collections.Generic.List<string> ClearDesktop() {
          var log = new System.Collections.Generic.List<string>();
          var keep = new System.Collections.Generic.HashSet<string> { "Progman", "WorkerW", "Shell_TrayWnd", "Shell_SecondaryTrayWnd" };
          EnumWindows((h, l) => {
            if (!IsWindowVisible(h) || IsIconic(h)) return true;
            int cloaked = 0;
            if (DwmGetWindowAttribute(h, 14, out cloaked, 4) == 0 && cloaked != 0) return true;
            var cls = new System.Text.StringBuilder(256);
            var title = new System.Text.StringBuilder(256);
            GetClassName(h, cls, 256);
            GetWindowText(h, title, 256);
            if (keep.Contains(cls.ToString())) return true;
            uint pid;
            GetWindowThreadProcessId(h, out pid);
            string proc = "?";
            try { proc = System.Diagnostics.Process.GetProcessById((int)pid).ProcessName; } catch {}
            bool dialog = cls.ToString() == "#32770";
            if (dialog) PostMessage(h, 0x0010, IntPtr.Zero, IntPtr.Zero);  // WM_CLOSE
            else ShowWindow(h, 6);  // SW_MINIMIZE
            log.Add(string.Format("{0} class '{1}' title '{2}' process {3} ({4})", dialog ? "Closed" : "Minimized", cls, title, proc, pid));
            return true;
          }, IntPtr.Zero);
          return log;
        }
        '@
        $start = [ElectronCI.HitTest]::StartMenuState()
        Write-Host "Start menu: $start"
        if ($start -eq 'open') {
          [ElectronCI.HitTest]::PressEscape()
          Start-Sleep -Seconds 1
          Write-Host "Start menu after Escape: $([ElectronCI.HitTest]::StartMenuState())"
        }
        # Closing a dialog can reveal another (System Properties leaves its
        # Performance Options behind), so repeat until nothing is left.
        for ($pass = 1; $pass -le 3; $pass++) {
          $done = [ElectronCI.HitTest]::ClearDesktop()
          $done | ForEach-Object { Write-Host "Pass ${pass}: $_" }
          Start-Sleep -Seconds 1
          if ($done.Count -eq 0) { break }
        }
        foreach ($xy in @(@(300, 300), @(512, 384))) {
          $p = New-Object ElectronCI.HitTest+POINT
          $p.X = $xy[0]; $p.Y = $xy[1]
          $h = [ElectronCI.HitTest]::GetAncestor([ElectronCI.HitTest]::WindowFromPoint($p), 2)
          $cls = New-Object System.Text.StringBuilder 256
          $title = New-Object System.Text.StringBuilder 256
          [void][ElectronCI.HitTest]::GetClassName($h, $cls, 256)
          [void][ElectronCI.HitTest]::GetWindowText($h, $title, 256)
          [uint32]$procId = 0
          [void][ElectronCI.HitTest]::GetWindowThreadProcessId($h, [ref]$procId)
          $proc = (Get-Process -Id $procId -ErrorAction SilentlyContinue).ProcessName
          Write-Host ("Window at ({0},{1}): class '{2}' title '{3}' process {4} ({5})" -f $p.X, $p.Y, $cls, $title, $proc, $procId)
        }
        # Stop the running WSL update, and its launcher when that is a script
        # host outside this step's own ancestry.
        try {
          $ancestors = @()
          $cur = Get-CimInstance Win32_Process -Filter "ProcessId=$PID"
          while ($cur -and $ancestors.Count -lt 10) { $ancestors += $cur.ProcessId; $cur = Get-CimInstance Win32_Process -Filter "ProcessId=$($cur.ParentProcessId)" }
          $scriptHosts = 'powershell.exe', 'pwsh.exe', 'cmd.exe', 'wscript.exe', 'cscript.exe'
          Get-CimInstance Win32_Process -Filter "Name='wsl.exe'" | Where-Object { $_.CommandLine -match '--update' } | ForEach-Object {
            Write-Host "WSL update $($_.ProcessId): $($_.CommandLine)"
            $parent = Get-CimInstance Win32_Process -Filter "ProcessId=$($_.ParentProcessId)"
            $p = $parent
            for ($i = 0; $p -and $i -lt 4; $i++) {
              Write-Host "  launched by $($p.ProcessId) $($p.Name): $($p.CommandLine)"
              $p = Get-CimInstance Win32_Process -Filter "ProcessId=$($p.ParentProcessId)"
            }
            if ($parent -and $scriptHosts -contains $parent.Name -and $ancestors -notcontains $parent.ProcessId) {
              Write-Host "  stopping launcher $($parent.ProcessId)"
              Stop-Process -Id $parent.ProcessId -Force -ErrorAction SilentlyContinue
            }
            Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue
          }
        } catch {
          Write-Host "Stopping the WSL update failed: $_"
        }
        $minimizer = Join-Path $env:GITHUB_WORKSPACE 'src\electron\script\actions\minimize-wsl-terminals.ps1'
        $log = Join-Path $env:RUNNER_TEMP 'minimize-wsl-terminals.log'
        $empty = Join-Path $env:RUNNER_TEMP 'minimize-wsl-terminals.in'
        New-Item -ItemType File -Force -Path $empty | Out-Null
        # Keep the step's output pipes out of the background minimizer, so
        # the runner does not wait for it to exit.
        Add-Type -Namespace ElectronCI -Name Handles -MemberDefinition @'
        [DllImport("kernel32.dll")] public static extern IntPtr GetStdHandle(int n);
        [DllImport("kernel32.dll")] public static extern bool SetHandleInformation(IntPtr h, int mask, int flags);
        '@
        foreach ($n in -10, -11, -12) { [void][ElectronCI.Handles]::SetHandleInformation([ElectronCI.Handles]::GetStdHandle($n), 1, 0) }
        Start-Process powershell.exe -NoNewWindow -RedirectStandardInput $empty -RedirectStandardOutput "$log.out" -RedirectStandardError "$log.err" `
          -ArgumentList '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $minimizer, '-Log', $log, '-Seconds', '3600'
        for ($i = 0; $i -lt 30 -and -not (Test-Path $log); $i++) { Start-Sleep -Seconds 1 }
        if (Test-Path $log) { Get-Content $log | Write-Host } else { Write-Host "WSL terminal minimizer did not start: $(Get-Content -Raw "$log.err" -ErrorAction SilentlyContinue)" }

    - name: Run the setIgnoreMouseEvents spec
      shell: bash
      timeout-minutes: 60
      env:
        ELECTRON_DISABLE_SECURITY_WARNINGS: 1
      run: |
        cd src/electron
        export ELECTRON_TEST_RESULTS_DIR=`pwd`/junit
        export ELECTRON_ALSO_LOG_TO_STDERR=1
        mkdir -p spec/artifacts
        node script/yarn.js test --runners=main --trace-uncaught \
          --enable-logging=file --log-file=$(pwd -W)/spec/artifacts/electron_debug.log \
          --files spec/api-browser-window-ignore-mouse-events.spec.ts
    - name: Print minimized WSL terminals (Windows)
      if: always()
      continue-on-error: true
      shell: pwsh
      run: |
        $log = Join-Path $env:RUNNER_TEMP 'minimize-wsl-terminals.log'
        foreach ($f in "$log.err", "$log.out", $log) {
          if (Test-Path $f) { Write-Host "--- $f"; Get-Content $f | Write-Host }
        }
    - name: Take screenshot on failure
      if: ${{ cancelled() || failure() }}
      shell: bash
      run: |
        mkdir -p src/electron/spec/artifacts
        screenshot_file="$(cygpath -w "$PWD/src/electron/spec/artifacts/screenshot-final.png")"
        powershell -command "Add-Type -AssemblyName System.Windows.Forms; \$screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds; \$bitmap = New-Object System.Drawing.Bitmap(\$screen.Width, \$screen.Height); \$graphics = [System.Drawing.Graphics]::FromImage(\$bitmap); \$graphics.CopyFromScreen(\$screen.Location, [System.Drawing.Point]::Empty, \$screen.Size); \$bitmap.Save('$screenshot_file')" || true
    - name: Upload Test Artifacts
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      with:
        name: spike_test_artifacts_${{ env.ARTIFACT_KEY }}
        path: |
          src/electron/spec/artifacts
          src/electron/junit
        if-no-files-found: ignore
