name: Pipeline Segment - Electron Coverage Report

# Indexes the .profraw counters produced by a coverage test run and renders an
# llvm-cov HTML report for Electron's own C++ sources. Chromium sources are
# deliberately out of scope: only src/electron is checked out here, so there is
# nothing on disk for llvm-cov to render for them. See
# //docs/testing/code_coverage.md in the Chromium tree. The JavaScript
# coverage of lib/ from the same run goes in its js/ directory.

on:
  workflow_call:
    inputs:
      target-platform:
        type: string
        description: 'Platform the coverage build targeted, can be macos, win or linux'
        required: true
      target-arch:
        type: string
        description: 'Arch the coverage build targeted, can be x64 or arm64'
        required: true
      report-runs-on:
        type: string
        description: 'What host to render the report on'
        required: true
      report-container:
        type: string
        description: 'JSON container information for aks runs-on'
        required: false
        default: '{"image":null}'

concurrency:
  group: electron-coverage-report-${{ inputs.target-platform }}-${{ inputs.target-arch }}-${{ github.ref_protected == true && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref_protected != true }}

permissions: {}

jobs:
  report:
    runs-on: ${{ inputs.report-runs-on }}
    permissions:
      contents: read
    container: ${{ fromJSON(inputs.report-container) }}
    # Callers' defaults do not propagate into reusable workflows.
    defaults:
      run:
        shell: bash
    env:
      ELECTRON_OUT_DIR: Default
      BUILD_TYPE: ${{ inputs.target-platform == 'macos' && 'darwin' || inputs.target-platform }}
      TARGET_ARCH: ${{ inputs.target-arch }}
      ARTIFACT_KEY: ${{ inputs.target-platform == 'macos' && 'darwin' || inputs.target-platform }}_${{ inputs.target-arch }}
    steps:
    - name: Checkout Electron
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: src/electron
        persist-credentials: false
    # dist.zip holds the instrumented binaries; src_artifacts.tar carries the
    # llvm-profdata/llvm-cov the build job staged into third_party/llvm-build.
    - name: Download Generated Artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: generated_artifacts_${{ env.ARTIFACT_KEY }}
        path: ./generated_artifacts_${{ env.ARTIFACT_KEY }}
    - name: Download Src Artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: src_artifacts_${{ env.ARTIFACT_KEY }}
        path: ./src_artifacts_${{ env.ARTIFACT_KEY }}
    - name: Restore Generated Artifacts
      run: ./src/electron/script/actions/restore-artifacts.sh
    - name: Unzip Dist (win)
      if: ${{ inputs.target-platform == 'win' }}
      shell: powershell
      run: |
        Set-ExecutionPolicy Bypass -Scope Process -Force
        cd src/out/Default
        Expand-Archive -Force dist.zip -DestinationPath ./
    - name: Unzip Dist
      if: ${{ inputs.target-platform != 'win' }}
      run: |
        cd src/out/Default
        unzip -:o dist.zip
    - name: Download Coverage Profiles
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: coverage_profraw_${{ env.ARTIFACT_KEY }}
        path: profraw
    - name: Generate Coverage Report
      env:
        TARGET_PLATFORM: ${{ inputs.target-platform }}
      run: |
        if [ "$TARGET_PLATFORM" = "win" ]; then
          # llvm-cov.exe is a native Windows binary: hand it Windows paths
          # (pwd -W) rather than MSYS ones.
          ROOT=$(pwd -W)
        else
          ROOT=$PWD
        fi
        LLVM_BIN="$ROOT/src/third_party/llvm-build/Release+Asserts/bin"
        LLVM_PROFDATA="$LLVM_BIN/llvm-profdata"
        LLVM_COV="$LLVM_BIN/llvm-cov"
        if [ "$TARGET_PLATFORM" = "win" ]; then
          LLVM_PROFDATA="$LLVM_BIN/llvm-profdata.exe"
          LLVM_COV="$LLVM_BIN/llvm-cov.exe"
        fi
        chmod +x "$LLVM_PROFDATA" "$LLVM_COV"

        # --failure-mode=all tolerates profiles truncated by processes the
        # suite kills, as long as at least one input is readable.
        "$LLVM_PROFDATA" merge -sparse --failure-mode=all \
          -o coverage.profdata profraw/*.profraw

        if [ "$TARGET_PLATFORM" = "macos" ]; then
          # Almost all of Electron's code lives in the framework; the app
          # executable is a thin launcher.
          objects=(
            "src/out/Default/Electron.app/Contents/Frameworks/Electron Framework.framework/Versions/A/Electron Framework"
            -object "src/out/Default/Electron.app/Contents/MacOS/Electron"
          )
        elif [ "$TARGET_PLATFORM" = "win" ]; then
          # Electron's own code is all linked into electron.exe.
          objects=("$ROOT/src/out/Default/electron.exe")
        else
          objects=("src/out/Default/electron")
        fi

        # Coverage mapping records source paths relative to the build dir, so
        # -compilation-dir is what makes ../../electron/... resolve to the
        # checkout here. The trailing paths restrict the report to Electron's
        # own C++.
        sources=("$ROOT/src/electron/shell" "$ROOT/src/electron/chromium_src")

        case "$TARGET_PLATFORM" in
          linux) PLATFORM_NAME=Linux ;;
          macos) PLATFORM_NAME=macOS ;;
          win) PLATFORM_NAME=Windows ;;
          *) PLATFORM_NAME=$TARGET_PLATFORM ;;
        esac

        "$LLVM_COV" show \
          -format=html \
          -output-dir=coverage-report \
          -project-title="Electron ($PLATFORM_NAME $TARGET_ARCH)" \
          -instr-profile=coverage.profdata \
          -compilation-dir="$ROOT/src/out/Default" \
          "${objects[@]}" \
          "${sources[@]}"

        "$LLVM_COV" report \
          -instr-profile=coverage.profdata \
          -compilation-dir="$ROOT/src/out/Default" \
          "${objects[@]}" \
          "${sources[@]}" > coverage-report/summary.txt
    # Best effort: the C++ report above is still published without it.
    - name: Download JS Coverage
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: coverage_js_${{ env.ARTIFACT_KEY }}
        path: js-coverage
    - name: Generate JS Coverage Report
      continue-on-error: true
      run: |
        cd src/electron
        node script/yarn.js install --immutable --mode=skip-build
        # Maps the bundles' coverage back to lib/ through the source maps the
        # build wrote next to them (electron_js_sourcemaps).
        node script/lib-coverage-report.mjs \
          --input ../../js-coverage \
          --gen-dir ../out/Default/gen \
          --output ../../coverage-report/js
    - name: Upload Coverage Report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
      with:
        name: coverage_report_${{ env.ARTIFACT_KEY }}
        path: coverage-report
        if-no-files-found: error
