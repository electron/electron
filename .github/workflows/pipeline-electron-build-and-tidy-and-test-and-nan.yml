name: Electron Build & Clang Tidy & Test (+ Node + NaN) Pipeline

on:
  workflow_call:
    inputs:
      target-platform:
        type: string
        description: 'Platform to run on, can be macos, win or linux.'
        required: true
      target-arch:
        type: string
        description: 'Arch to build for, can be x64 or arm64'
        required: true
      build-runs-on:
        type: string
        description: 'What host to run the build'
        required: true
      clang-tidy-runs-on:
        type: string
        description: 'What host to run clang-tidy on'
        required: true
      test-runs-on:
        type: string
        description: 'What host to run the tests on'
        required: true
      build-container:
        type: string
        description: 'JSON container information for aks runs-on'
        required: false
        default: '{"image":null}'
      clang-tidy-container:
        type: string
        description: 'JSON container information to run clang-tidy on'
        required: false
        default: '{"image":null}'
      run-clang-tidy:
        type: boolean
        description: 'Run the clang-tidy job; when false the job is skipped but its check is still reported as skipped'
        required: false
        default: true
      test-container:
        type: string
        description: 'JSON container information for testing'
        required: false
        default: '{"image":null}'
      is-release:
        description: 'Whether this build job is a release job'
        required: true
        type: boolean
        default: false
      gn-build-type:
        description: 'The gn build type - testing or release'
        required: true
        type: string
        default: testing
      generate-symbols: 
        description: 'Whether or not to generate symbols'
        required: true
        type: boolean
        default: false
      upload-to-storage: 
        description: 'Whether or not to upload build artifacts to external storage'
        required: true
        type: string
        default: '0'
      is-asan: 
        description: 'Building the Address Sanitizer (ASan) Linux build'
        required: false
        type: boolean
        default: false
    secrets:
      # ACTIONS_STEP_DEBUG is a reserved name for workflow_call secrets; the
      # workflows that read it map this back to the ACTIONS_STEP_DEBUG env.
      CI_STEP_DEBUG:
        required: false
      CHROMIUM_GIT_COOKIE:
        required: false
      CHROMIUM_GIT_COOKIE_WINDOWS_STRING:
        required: false
      CLOUDFLARE_TUNNEL_CERT:
        required: false
      CLOUDFLARE_USER_CA_CERT:
        required: false
      DD_API_KEY:
        required: false
      ELECTRON_ARTIFACTS_BLOB_STORAGE:
        required: false
      ELECTRON_RBE_JWT:
        required: false
      SSH_DEBUG_AUTHORIZED_USERS:
        required: false
      SUDOWOODO_EXCHANGE_URL:
        required: false

permissions: {}

concurrency:
  group: electron-build-and-test-and-nan-${{ inputs.target-platform }}-${{ inputs.target-arch }}-${{ github.ref_protected == true && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref_protected != true }}

jobs:
  build:
    uses: ./.github/workflows/pipeline-segment-electron-build.yml
    permissions:
      contents: read
    with:
      build-runs-on: ${{ inputs.build-runs-on }}
      build-container: ${{ inputs.build-container }}
      target-platform: ${{ inputs.target-platform }}
      target-arch: ${{ inputs.target-arch }}
      is-release: ${{ inputs.is-release }}
      gn-build-type: ${{ inputs.gn-build-type }}
      generate-symbols: ${{ inputs.generate-symbols }}
      upload-to-storage: ${{ inputs.upload-to-storage }}
      upload-out-gen-artifacts: true
    secrets:
      CI_STEP_DEBUG: ${{ secrets.CI_STEP_DEBUG }}
      CHROMIUM_GIT_COOKIE: ${{ secrets.CHROMIUM_GIT_COOKIE }}
      CHROMIUM_GIT_COOKIE_WINDOWS_STRING: ${{ secrets.CHROMIUM_GIT_COOKIE_WINDOWS_STRING }}
      CLOUDFLARE_TUNNEL_CERT: ${{ secrets.CLOUDFLARE_TUNNEL_CERT }}
      CLOUDFLARE_USER_CA_CERT: ${{ secrets.CLOUDFLARE_USER_CA_CERT }}
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      ELECTRON_ARTIFACTS_BLOB_STORAGE: ${{ secrets.ELECTRON_ARTIFACTS_BLOB_STORAGE }}
      ELECTRON_RBE_JWT: ${{ secrets.ELECTRON_RBE_JWT }}
      SSH_DEBUG_AUTHORIZED_USERS: ${{ secrets.SSH_DEBUG_AUTHORIZED_USERS }}
      SUDOWOODO_EXCHANGE_URL: ${{ secrets.SUDOWOODO_EXCHANGE_URL }}
  clang-tidy:
    uses: ./.github/workflows/pipeline-segment-electron-clang-tidy.yml
    permissions:
      contents: read
    needs: build
    if: ${{ inputs.run-clang-tidy }}
    with:
      clang-tidy-runs-on: ${{ inputs.clang-tidy-runs-on }}
      clang-tidy-container: ${{ inputs.clang-tidy-container }}
      target-platform: ${{ inputs.target-platform }}
      target-arch: ${{ inputs.target-arch }}
    secrets:
      ELECTRON_RBE_JWT: ${{ secrets.ELECTRON_RBE_JWT }}
  test:
    uses: ./.github/workflows/pipeline-segment-electron-test.yml
    permissions:
      contents: read
      issues: read
      pull-requests: read
    needs: build
    with:
      target-arch: ${{ inputs.target-arch }}
      target-platform: ${{ inputs.target-platform }}
      test-runs-on: ${{ inputs.test-runs-on }}
      test-container: ${{ inputs.test-container }}
    secrets:
      CI_STEP_DEBUG: ${{ secrets.CI_STEP_DEBUG }}
      CHROMIUM_GIT_COOKIE: ${{ secrets.CHROMIUM_GIT_COOKIE }}
      CHROMIUM_GIT_COOKIE_WINDOWS_STRING: ${{ secrets.CHROMIUM_GIT_COOKIE_WINDOWS_STRING }}
      CLOUDFLARE_TUNNEL_CERT: ${{ secrets.CLOUDFLARE_TUNNEL_CERT }}
      CLOUDFLARE_USER_CA_CERT: ${{ secrets.CLOUDFLARE_USER_CA_CERT }}
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      ELECTRON_RBE_JWT: ${{ secrets.ELECTRON_RBE_JWT }}
      SSH_DEBUG_AUTHORIZED_USERS: ${{ secrets.SSH_DEBUG_AUTHORIZED_USERS }}
  test-wayland:
    uses: ./.github/workflows/pipeline-segment-electron-test.yml
    permissions:
      contents: read
      issues: read
      pull-requests: read
    needs: build
    if: ${{ inputs.target-platform == 'linux' && inputs.target-arch == 'x64' && !inputs.is-asan }}
    with:
      target-arch: ${{ inputs.target-arch }}
      target-platform: ${{ inputs.target-platform }}
      test-runs-on: ${{ inputs.test-runs-on }}
      test-container: ${{ inputs.test-container }}
      display-server: wayland
    secrets:
      CI_STEP_DEBUG: ${{ secrets.CI_STEP_DEBUG }}
      CHROMIUM_GIT_COOKIE: ${{ secrets.CHROMIUM_GIT_COOKIE }}
      CHROMIUM_GIT_COOKIE_WINDOWS_STRING: ${{ secrets.CHROMIUM_GIT_COOKIE_WINDOWS_STRING }}
      CLOUDFLARE_TUNNEL_CERT: ${{ secrets.CLOUDFLARE_TUNNEL_CERT }}
      CLOUDFLARE_USER_CA_CERT: ${{ secrets.CLOUDFLARE_USER_CA_CERT }}
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      ELECTRON_RBE_JWT: ${{ secrets.ELECTRON_RBE_JWT }}
      SSH_DEBUG_AUTHORIZED_USERS: ${{ secrets.SSH_DEBUG_AUTHORIZED_USERS }}
  nn-test:
    uses: ./.github/workflows/pipeline-segment-node-nan-test.yml
    permissions:
      contents: read
    needs: build
    with:
      target-arch: ${{ inputs.target-arch }}
      target-platform: ${{ inputs.target-platform }}
      test-runs-on: ${{ inputs.test-runs-on }}
      test-container: ${{ inputs.test-container }}
      gn-build-type: ${{ inputs.gn-build-type }}
    secrets:
      CHROMIUM_GIT_COOKIE: ${{ secrets.CHROMIUM_GIT_COOKIE }}
      ELECTRON_RBE_JWT: ${{ secrets.ELECTRON_RBE_JWT }}
