name: Pull Request Labeled

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] deliberate; only base-branch code runs, the PR head is never checked out (see SECURITY note)
    types: [labeled]

# SECURITY: This workflow uses pull_request_target and has access to secrets.
# Do NOT checkout or run code from the PR head. All code execution must use
# the base branch only. Adding a ref to PR head would expose secrets to
# untrusted code.
permissions: {}

jobs:
  pull-request-labeled-backport-requested:
    name: backport/requested label added
    if: github.event.label.name == 'backport/requested 🗳'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Trigger Slack workflow
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.BACKPORT_REQUESTED_SLACK_WEBHOOK_URL }} 
          webhook-type: webhook-trigger
          payload: |
            {
              "base_ref": ${{ toJSON(github.event.pull_request.base.ref) }},
              "title": ${{ toJSON(github.event.pull_request.title) }},
              "url": ${{ toJSON(github.event.pull_request.html_url) }},
              "user": ${{ toJSON(github.event.pull_request.user.login) }}
            }
  pull-request-labeled-deprecation-review-complete:
    name: deprecation-review/complete label added
    if: github.event.label.name == 'deprecation-review/complete ✅'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Generate GitHub App token
        uses: electron/github-app-auth-action@5f70a3726af01b612f29aac96d05aa524389c9e9 # v2.1.0
        id: generate-token
        with:
          creds: ${{ secrets.RELEASE_BOARD_GH_APP_CREDS }}
          org: electron
      - name: Set status
        uses: dsanders11/project-actions/edit-item@d5490cb5784c8570b072fbf02f974fd5ee3e145f # v2.1.0
        with:
          token: ${{ steps.generate-token.outputs.token }}
          project-number: 94
          field: Status
          field-value: ✅ Reviewed
  pull-request-labeled-ai-pr:
    name: ai-pr label added
    if: github.event.label.name == 'ai-pr' && github.event.pull_request.state != 'closed'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Generate GitHub App token
      uses: electron/github-app-auth-action@5f70a3726af01b612f29aac96d05aa524389c9e9 # v2.1.0
      id: generate-token
      with:
        creds: ${{ secrets.ISSUE_TRIAGE_GH_APP_CREDS }}
    - name: Comment and close the pull request
      env:
        GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
        GH_REPO: electron/electron
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      run: |
        gh pr comment "$PR_NUMBER" --body-file - <<EOF
        <!-- ai-pr -->

        *AI PR Detected*

        Hello @${PR_AUTHOR}. Due to the high amount of AI spam PRs we receive, if a PR is detected to be majority AI-generated without disclosure and untested, we will automatically close the PR.

        We welcome the use of AI tools, as long as the PR meets our quality standards and has clearly been built and tested. If you believe your PR was closed in error, we welcome you to resubmit. However, please read our [CONTRIBUTING.md](https://github.com/electron/electron/blob/main/CONTRIBUTING.md) and [AI Tool Policy](https://github.com/electron/governance/blob/main/policy/ai.md) carefully before reopening. Thanks for your contribution.
        EOF
        gh pr close "$PR_NUMBER"
  # Starts the WPT workflow on the pull request's branch. Only the branch name
  # is used, and only for branches of this repository; nothing from the pull
  # request is checked out or run here.
  pull-request-labeled-run-wpt:
    name: run-wpt label added
    if: github.event.label.name == 'run-wpt' && github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: write
    steps:
    - name: Run WPT or explain when it will run
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        if [ "$HEAD_REPO" = "$GH_REPO" ]; then
          gh workflow run wpt.yml --ref "$HEAD_REF" -f wpt-revision=pinned
        else
          gh pr comment "$PR_NUMBER" --body-file - <<EOF
        <!-- run-wpt -->

        The \`run-wpt\` label was added. Workflows cannot be started on a fork's branch from here, so web-platform-tests will run as part of the Build workflow the next time commits are pushed to this pull request.
        EOF
        fi
