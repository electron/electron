name: 'Free Space macOS'
description: 'Checks out Electron and stores it in the AKS Cache'
runs:
  using: "composite"
  steps:
    - name: Free Space on MacOS
      shell: bash
      run: |
        echo "Disk usage before cleanup:"
        df -h
        # Everything below is renamed into DEL_TARGET (an instant same-volume
        # move) and deleted by a detached process at the end of this step, so
        # the ~230GB of deletes run alongside the src cache restore instead of
        # blocking it. Callers wait for enough free space, not for the deletes.
        DEL_TARGET="$TMPDIR/del-target-$$"
        sudo mkdir -p "$DEL_TARGET"

        tmpify() {
          if [ -d "$1" ]; then
            sudo mv "$1" "$DEL_TARGET/$(echo $1|shasum -a 256|head -n1|cut -d " " -f1)"
          fi
        }

        strip_universal_deep() {
          if [ -d "$1" ]; then
            opwd=$(pwd)
            cd $1
            f=$(find . -perm +111 -type f)
            for fp in $f
            do
              if [[ $(file "$fp") == *"universal binary"* ]]; then
                if [ "`arch`" == "arm64" ]; then
                  if [[ $(file "$fp") == *"x86_64"* ]]; then
                    sudo lipo -remove x86_64 "$fp" -o "$fp" || true
                  fi
                else
                  if [[ $(file "$fp") == *"arm64e)"* ]]; then
                    sudo lipo -remove arm64e "$fp" -o "$fp" || true
                  fi
                  if [[ $(file "$fp") == *"arm64)"* ]]; then
                    sudo lipo -remove arm64 "$fp" -o "$fp" || true
                  fi
                fi
              fi
            done

            cd $opwd
          fi
        }

        tmpify /Library/Developer/CoreSimulator
        tmpify ~/Library/Developer/CoreSimulator
        tmpify $(xcode-select -p)/Platforms/AppleTVOS.platform
        tmpify $(xcode-select -p)/Platforms/iPhoneOS.platform
        tmpify $(xcode-select -p)/Platforms/WatchOS.platform
        tmpify $(xcode-select -p)/Platforms/WatchSimulator.platform
        tmpify $(xcode-select -p)/Platforms/AppleTVSimulator.platform
        tmpify $(xcode-select -p)/Platforms/iPhoneSimulator.platform
        tmpify $(xcode-select -p)/Platforms/XROS.platform
        tmpify $(xcode-select -p)/Platforms/XRSimulator.platform
        tmpify $(xcode-select -p)/Platforms/DriverKit.platform
        tmpify $(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/metal/ios
        tmpify $(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift
        tmpify $(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0
        tmpify ~/.rubies
        tmpify ~/Library/Caches/Homebrew
        tmpify /usr/local/Homebrew

        # Remove every Xcode install except the one currently selected.
        # The image ships many versions (16.0-26.x) and each is tens of GB.
        active_xcode=$(xcode-select -p 2>/dev/null | sed -E 's#(/Applications/Xcode[^/]*\.app)/.*#\1#')
        if [[ "$active_xcode" == /Applications/Xcode*.app ]]; then
          for app in /Applications/Xcode*.app; do
            if [ "$app" != "$active_xcode" ]; then
              tmpify "$app"
            fi
          done
        fi

        # Simulator runtime images (iOS/xrOS/watchOS/tvOS) staged as MobileAssets.
        # tmpify of /Library/Developer/CoreSimulator above only removes the mount
        # points; the backing images here are ~113GB that Electron never uses.
        tmpify /System/Library/AssetsV2/com_apple_MobileAsset_iOSSimulatorRuntime
        tmpify /System/Library/AssetsV2/com_apple_MobileAsset_xrOSSimulatorRuntime
        tmpify /System/Library/AssetsV2/com_apple_MobileAsset_watchOSSimulatorRuntime
        tmpify /System/Library/AssetsV2/com_apple_MobileAsset_appleTVOSSimulatorRuntime

        tmpify /Applications/Safari.app
        tmpify "/Applications/Google Chrome.app"
        tmpify "/Applications/Google Chrome for Testing.app"
        tmpify /Applications/Firefox.app
        tmpify "/Applications/Microsoft Edge.app"
        tmpify ~/project/src/third_party/catapult/tracing/test_data
        tmpify ~/project/src/third_party/angle/third_party/VK-GL-CTS
        tmpify /Users/runner/Library/Android
        tmpify $JAVA_HOME_11_arm64
        tmpify $JAVA_HOME_17_arm64
        tmpify $JAVA_HOME_21_arm64
        tmpify $JAVA_HOME_25_arm64
        tmpify /Users/runner/.dotnet/
        tmpify /Users/runner/.rustup
        # CodeQL bundle and unused cached runtimes in the hosted toolcache
        tmpify /Users/runner/hostedtoolcache/CodeQL
        tmpify /Users/runner/hostedtoolcache/go
        tmpify /Users/runner/hostedtoolcache/Ruby
        tmpify /Users/runner/hostedtoolcache/PyPy

        # remove homebrew packages we don't need
        if command -v brew &> /dev/null; then
          # Best-effort: brew fetches formulae.brew.sh metadata even to uninstall, and a DNS blip there must not fail the build (the tmpify moves above are the real reclaim).
          brew uninstall -f --zap aws-sam-cli session-manager-plugin gcc gcc@13 gcc@14 gcc@15 llvm@18 gradle maven ant azure-cli bazel || true
          brew autoremove || true
        fi

        # lipo off some huge binaries arm64 versions to save space
        strip_universal_deep $(xcode-select -p)/../SharedFrameworks
        # strip_arm_deep /System/Volumes/Data/Library/Developer/CommandLineTools/usr
        sudo mdutil -a -i off

        # Delete the renamed directories in a detached process. The runner only
        # reaps orphaned processes when the job ends, and by then the deletes
        # have long finished.
        sudo nohup rm -rf "$DEL_TARGET" > /dev/null 2>&1 &
