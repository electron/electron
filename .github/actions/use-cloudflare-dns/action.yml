name: 'Use Cloudflare DNS on macOS'
description: 'Points the macOS system resolver directly at Cloudflare DNS instead of the VM host DNS proxy'
runs:
  using: "composite"
  steps:
    - name: Use Cloudflare DNS
      shell: bash
      run: |
        # macOS runners are VMs whose DHCP-provided resolver (192.168.64.1) is
        # a UDP-only caching proxy on the VM host. Query Cloudflare directly.
        networksetup -listallnetworkservices | tail -n +2 | grep -v '^\*' | while IFS= read -r svc; do
          sudo networksetup -setdnsservers "$svc" 1.1.1.1 1.0.0.1
        done
        sudo dscacheutil -flushcache
        sudo killall -HUP mDNSResponder
        scutil --dns | sed -n '/^resolver #1/,/^$/p'
        for i in 1 2 3 4 5; do
          if dscacheutil -q host -a name github.com | grep -q ip_address; then
            echo "DNS is now resolving via Cloudflare"
            exit 0
          fi
          sleep 1
        done
        echo "::warning::Name resolution failed via Cloudflare DNS, reverting to the DHCP-provided resolver"
        networksetup -listallnetworkservices | tail -n +2 | grep -v '^\*' | while IFS= read -r svc; do
          sudo networksetup -setdnsservers "$svc" Empty
        done
        sudo dscacheutil -flushcache
        sudo killall -HUP mDNSResponder
