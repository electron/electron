name: 'Fix Sync'
description: 'Ensures proper binaries are in place'
# This action is required to correct for differences between "gclient sync"
# on Linux and the expected state on macOS/windows. This requires:
# 1. Fixing Clang Install on Windows (wrong binary)
# 2. Fixing esbuild (wrong binary)
# 3. Fixing rustc on Windows (wrong binary)
# 4. Fixing gn (wrong binary)
# 5. Ensuring we are using the correct ninja and adding it to PATH
# 6. Fixing angle (wrong remote)
# 7. Install windows toolchain on Windows
# 8. Fix node binary on Windows
# 9. Fix rc binary on Windows
# 10. Fix clang-format binary on Windows
# 11. Fixing the hermetic host Python binary
# 12. Fixing libclang on Windows (missing library)
#
# The macOS src cache is synced with host_os=mac and host_cpu=arm64, so every
# dep and hook that DEPS selects by host vars (clang, rust, dsymutil,
# typescript-go, ...) is already the right binary for the Apple Silicon
# runners. What still needs fixing on macOS are CIPD packages whose
# ${platform}/${arch} templates the cipd client expands on the Linux sync host.
# The Windows cache is synced with host_os=linux, so it also needs the
# host-selected tools replaced.
inputs:
  target-platform:
    description: 'Target platform, should be linux, win, macos'
runs:
  using: "composite"
  steps:
    # These fix-ups are independent downloads into different directories, so
    # run them concurrently. Each one logs to its own file, which is printed
    # once they finish; the step fails if any of them failed.
    - name: Fix llvm, rustc and angle git
      if: ${{ inputs.target-platform != 'linux' }}
      shell: bash
      env:
        TARGET_PLATFORM: ${{ inputs.target-platform }}
      run : |
        RETRY="$PWD/src/electron/script/actions/retry.sh"
        LOG_DIR=$(mktemp -d)

        fix_llvm() {
          rm -rf src/third_party/llvm-build
          python3 src/tools/clang/scripts/update.py
          # Refs https://chromium-review.googlesource.com/c/chromium/src/+/6667681
          python3 src/tools/clang/scripts/update.py --package objdump
          python3 src/tools/clang/scripts/update.py --package clang-tidy
        }

        fix_rustc() {
          rm -rf src/third_party/rust-toolchain
          python3 src/tools/rust/update_rust.py
        }

        fix_angle_git() {
          cd src/third_party/angle
          rm -f .git/objects/info/alternates
          git remote set-url origin https://github.com/google/angle.git
          cp .git/config .git/config.backup
          git remote remove origin
          mv .git/config.backup .git/config
          # A large fetch from github.com sometimes times out mid-transfer
          # ("curl 56", "invalid index-pack output"); retry it.
          bash "$RETRY" git fetch
        }

        # The macOS cache already holds the arm64 clang and rust toolchains
        # (see the header comment), so only Windows replaces them here.
        TASKS="fix_angle_git"
        if [ "$TARGET_PLATFORM" == "win" ]; then
          TASKS="fix_llvm fix_rustc $TASKS"
        fi
        PIDS=""
        for task in $TASKS; do
          ( set -eo pipefail; $task ) > "$LOG_DIR/$task.log" 2>&1 &
          PIDS="$PIDS $!"
        done

        FAILED=""
        set -- $PIDS
        for task in $TASKS; do
          if ! wait "$1"; then
            FAILED="$FAILED $task"
          fi
          shift
          echo "::group::$task"
          cat "$LOG_DIR/$task.log"
          echo "::endgroup::"
        done

        if [ -n "$FAILED" ]; then
          echo "::error::Failed:$FAILED"
          exit 1
        fi
    - name: Fix esbuild
      if: ${{ inputs.target-platform != 'linux' }}
      uses: ./src/electron/.github/actions/cipd-install
      with:
        cipd-root-prefix-path: src/third_party/devtools-frontend/src/
        dependency: esbuild
        deps-file: src/third_party/devtools-frontend/src/DEPS
        installation-dir: third_party/esbuild
        target-platform: ${{ inputs.target-platform }}
        package: infra/3pp/tools/esbuild/${platform}
    - name: Fix hermetic Python
      uses: ./src/electron/.github/actions/cipd-install
      with:
        dependency: cpython3-host
        deps-file: src/DEPS
        installation-dir: src/third_party/cpython3/host
        target-platform: ${{ inputs.target-platform }}
        package: infra/3pp/tools/cpython3/${platform}
    - name: Fix gn (macOS)
      if: ${{ inputs.target-platform == 'macos' }}
      uses: ./src/electron/.github/actions/cipd-install
      with:
        dependency: gn
        deps-file: src/DEPS
        installation-dir: src/buildtools/mac
        target-platform: ${{ inputs.target-platform }}
        package: gn/gn/mac-${arch}
    - name: Fix gn (Windows)
      if: ${{ inputs.target-platform == 'win' }}
      uses: ./src/electron/.github/actions/cipd-install
      with:
        dependency: gn
        deps-file: src/DEPS
        installation-dir: src/buildtools/win 
        target-platform: ${{ inputs.target-platform }}
        package: gn/gn/windows-amd64
    - name: Fix ninja
      if: ${{ inputs.target-platform != 'linux' }}
      uses: ./src/electron/.github/actions/cipd-install
      with:
        dependency: ninja
        deps-file: src/DEPS
        installation-dir: src/third_party/ninja
        target-platform: ${{ inputs.target-platform }}
        package: infra/3pp/tools/ninja/${platform}
    - name: Set ninja in path
      if: ${{ inputs.target-platform != 'linux' }}
      shell: bash
      run : | # zizmor: ignore[github-env] composite action; only run by trusted push/pull_request pipelines, value is build config
        echo "$(pwd)/src/third_party/ninja" >> $GITHUB_PATH
    - name: Fix siso
      uses: ./src/electron/.github/actions/cipd-install
      with:
        dependency: siso
        deps-file: src/DEPS
        installation-dir: src/third_party/siso/cipd
        target-platform: ${{ inputs.target-platform }}
        package: build/siso/${platform}
    - name: Get Windows toolchain
      if: ${{ inputs.target-platform == 'win' }}
      shell: powershell
      run: e d vpython3 src\build\vs_toolchain.py update --force
    # V8's metagen loads libclang into the build's own Python, so it must be the
    # package for this machine. The Windows cache is synced with host_os=linux,
    # which leaves no Windows package at all. Re-fetch just this dep: a one-dep
    # DEPS fed to gclient makes it select, verify and extract the object for the
    # host it is actually running on.
    - name: Fix libclang (Windows)
      if: ${{ inputs.target-platform == 'win' }}
      shell: bash
      run: |
        DEP=src/third_party/llvm-libclang
        OBJECTS=$(e d gclient getdep --deps-file=src/DEPS -r "$DEP" | tail -1)
        cat > libclang.DEPS <<EOF
        vars = {'non_git_source': 'True'}
        deps = {'$DEP': {'dep_type': 'gcs', 'bucket': 'chromium-browser-clang', 'objects': $OBJECTS}}
        EOF
        rm -rf "$DEP"
        e d gclient sync --spec="solutions=[{'name':'src','url':None,'deps_file':'../libclang.DEPS','managed':False}]"
        # The src cache has no gclient bookkeeping at the root; remove what this
        # one-dep sync wrote so later gclient runs do not see it.
        rm -f libclang.DEPS .gclient_entries .gclient_previous_sync_commits .gcs_entries
    - name: Download nodejs
      if: ${{ inputs.target-platform == 'win' }}
      shell: powershell
      run: |
        $nodedeps = e d gclient getdep --deps-file=src/DEPS -r src/third_party/node/win | ConvertFrom-JSON
        python3 src\third_party\depot_tools\download_from_google_storage.py --no_resume --no_auth --bucket chromium-nodejs -o src\third_party\node\win\node.exe $nodedeps.object_name
    - name: Download clang-format
      if: ${{ inputs.target-platform == 'win' }}
      shell: powershell
      run: |
        $clangformatdeps = e d gclient getdep --deps-file=src/DEPS -r src/buildtools/win-format | ConvertFrom-JSON
        New-Item -ItemType Directory -Force -Path src\buildtools\win-format | Out-Null
        python3 src\third_party\depot_tools\download_from_google_storage.py --no_resume --no_auth --bucket chromium-clang-format -o src\buildtools\win-format\clang-format.exe $clangformatdeps.object_name
    - name: Install rc
      if: ${{ inputs.target-platform == 'win' }}
      shell: bash
      run: |
        python3 src/third_party/depot_tools/download_from_google_storage.py --no_resume --no_auth --bucket chromium-browser-clang/rc -s src/build/toolchain/win/rc/win/rc.exe.sha1
