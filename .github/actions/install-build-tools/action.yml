name: 'Install Build Tools'
description: 'Installs an exact SHA of build tools'
runs:
  using: "composite"
  steps:
  - name: Install Build Tools
    shell: bash
    run: | # zizmor: ignore[github-env,adhoc-packages] adds depot_tools to PATH and installs latest build-tools by design; trusted pipeline runs
      if [ "$(expr substr $(uname -s) 1 10)" == "MSYS_NT-10" ]; then
        git config --global core.filemode false
        git config --global core.autocrlf false
        git config --global branch.autosetuprebase always
        git config --global core.fscache true
        git config --global core.longpaths true
        git config --global core.preloadindex true
        git config --global core.longpaths true
      fi
      export BUILD_TOOLS_SHA=1a105fe49c59e173d91925b4a1e6760bcff73cf9
      npm i -g @electron/build-tools
      # Update depot_tools to ensure python
      e d update_depot_tools
      e auto-update disable
      # Disable further updates of depot_tools
      e d auto-update disable
      if [ "$(expr substr $(uname -s) 1 10)" == "MSYS_NT-10" ]; then
        e d cipd.bat --version
        cp "C:\Python311\python.exe" "C:\Python311\python3.exe"
        # build-tools installs under the profile of whichever user the runner is
        # (ContainerAdministrator in the container image, a per-VM user on the
        # VM runners); USERPROFILE is what it uses and is already a Windows path.
        echo "$USERPROFILE\.electron_build_tools\third_party\depot_tools" >> $GITHUB_PATH
      else
        echo "$HOME/.electron_build_tools/third_party/depot_tools" >> $GITHUB_PATH
        echo "$HOME/.electron_build_tools/third_party/depot_tools/python-bin" >> $GITHUB_PATH
      fi
