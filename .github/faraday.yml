# faraday trust configuration for electron/electron.
# A bot listed here is "trusted": its pull requests need 1 maintainer
# approval instead of 2, provided every commit is verifiably the bot's own.
# See: https://github.com/electron/faraday

trusted-bots:
  # Backport PRs to release branches.
  - login: trop[bot]
    id: 37223003
  # Chrome security cherry-pick PRs to release branches.
  - login: electron-security-backports[bot]
    id: 312726202
  # PGO profile roll PRs; trusted only when every changed file is
  # under build/pgo_profiles/.
  - login: electron-pgo-updater[bot]
    id: 290827142
    paths:
      - build/pgo_profiles/**
  # Chromium / Node.js roll PRs.
  - login: electron-roller[bot]
    id: 84116207

trusted-reviewers:
  # Docs reviewer app — counts as at most one approval, and only
  # when every changed file is under docs/.
  - login: electron-docs-reviewer[bot]
    id: 114909645
    paths:
      - docs/**

# Review hold: while a PR carries the hold label (and none of the skip
# labels), faraday keeps its check pending until the configured number of
# weekday wall-clock hours has passed since the label was last applied.
hold-for-review:
  label: hold-for-review
  business-hours: 24
  skip-labels: [fast-track]
  timezone: America/Los_Angeles
