<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Electron benchmark: resize</title>
<style>
  body { margin: 0; font: 14px sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 4px; }
  .grid div { height: 40px; background: #9feaf9; border-radius: 4px; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script>
  // Layout-heavy content so each resize does real relayout and paint work.
  const grid = document.getElementById('grid');
  for (let i = 0; i < 3000; i++) {
    const cell = document.createElement('div');
    cell.textContent = i;
    grid.appendChild(cell);
  }
  const nextFrame = () => new Promise((resolve) => requestAnimationFrame(() => resolve()));

  // Time from BrowserWindow.setSize() to the first frame produced at the new
  // size: the resize event, then two rAFs. This floors at about two frames
  // (33 ms at 60 Hz), so it only catches large regressions; a trace-based
  // SetBounds-to-presented-frame metric replaces it later.
  window.cbRunResize = async (count) => {
    if (!window.cbHarness) {
      window.__cbMetrics = {};
      window.__cbResizeDone = true;
      return;
    }
    const samples = [];
    for (let i = 0; i < count; i++) {
      const [width, height] = i % 2 ? [1280, 800] : [900, 600];
      const resized = new Promise((resolve) => addEventListener('resize', resolve, { once: true }));
      const start = performance.now();
      await window.cbHarness.setSize(width, height);
      await resized;
      await nextFrame();
      await nextFrame();
      samples.push(performance.now() - start);
    }
    samples.sort((a, b) => a - b);
    window.__cbMetrics = {
      resize_median_ms: samples[samples.length >> 1],
      resize_p90_ms: samples[Math.floor(samples.length * 0.9)]
    };
    window.__cbResizeDone = true;
  };
</script>
</body>
</html>
